---
# =====================================================================
# Ponto central de configuração da VM de aula.
# Ajuste estes valores e todas as roles se adaptam.
# =====================================================================

# Usuário do aluno (dono dos arquivos, quem roda rustup etc.).
# O playbook roda via "sudo ansible-pull", ou seja, como root — então
# ansible_user_id seria "root" e o rustup/pipx iria para /root. SUDO_USER
# guarda quem chamou o sudo, que é o aluno. O fallback cobre o caso de rodar
# sem sudo (ansible-playbook direto, em teste).
aluno_usuario: "{{ lookup('env', 'SUDO_USER') | default(ansible_user_id, true) }}"
aluno_home: "{{ ('~' ~ aluno_usuario) | expanduser }}"

# --- PostgreSQL ---------------------------------------------------
# postgres_versao NÃO é definida aqui de propósito. Ela define o caminho dos
# configs (/etc/postgresql/<versao>/main) e muda a cada distro — 18 no Ubuntu
# 26.04, 17 no Debian 13, 16 no Ubuntu 24.04. Fixar o número aqui já quebrou
# uma vez, então a role postgresql instala o metapacote e descobre a versão da
# própria máquina. Para forçar um valor: ansible-pull ... -e postgres_versao=17
postgres_porta: 5432
# "md5" ou "scram-sha-256". scram é o padrão moderno recomendado.
postgres_metodo_auth: "scram-sha-256"

# Role de login do aluno no Postgres, usada pela conexão do DBeaver.
# A senha fica em texto claro de propósito: é VM de aula em rede local, e
# exigir ansible-vault acabaria com o "um comando só" do ansible-pull.
# Troque por turma se quiser.
postgres_usuario_aluno: "{{ aluno_usuario }}"
postgres_senha_aluno: "estudante"

# --- VS Code --------------------------------------------------------
# Extensões instaladas para o aluno. Os IDs são "publisher.nome" — os mesmos
# que aparecem na URL do marketplace.
vscode_extensoes_padrao:
  - ms-python.python              # Python: realce, debug, seleção de venv
  - mtxr.sqltools                 # cliente SQL dentro do editor
  - mtxr.sqltools-driver-pg       # driver PostgreSQL do SQLTools

# --- Python ---------------------------------------------------------
# Pacotes do apt instalados pela role python. Acrescente à lista conforme a
# aula precisar (python3-full, python3-dev, ...).
python_pacotes:
  - python3-pip
  - python3-venv

# Extras da role, desligados por padrão. O pipx serve para instalar ferramentas
# de linha de comando sem esbarrar no PEP 668.
python_instalar_pipx: false
python_instalar_scrapy: false

# --- Docker ---------------------------------------------------------
# O repositório da Docker é separado por distribuição: "ubuntu" ou "debian" na
# URL. ansible_distribution devolve "Ubuntu"/"Debian" — daí o lower.
docker_distro: "{{ ansible_facts.distribution | lower }}"
docker_pacotes:
  - docker-ce                # o daemon
  - docker-ce-cli            # o comando docker
  - containerd.io            # runtime de container
  - docker-buildx-plugin     # docker build moderno
  - docker-compose-plugin    # docker compose (v2, como subcomando)

# --- Metabase -------------------------------------------------------
# A versão vai no nome do JAR baixado; trocar aqui baixa a nova e reinicia o
# serviço. Versões em https://www.metabase.com/changelog
metabase_versao: "v0.63.5"
metabase_home: "/opt/metabase"
metabase_porta: 4444
metabase_url: "http://localhost:{{ metabase_porta }}"

# Conta de administrador criada pela API de setup na primeira execução, nos
# mesmos moldes do login do Airflow: fixa e igual para a turma inteira. É ela
# que permite cadastrar o Postgres sem passar pelo assistente na tela.
# O Metabase exige e-mail (não aceita usuário simples) para o login.
metabase_admin_email: "senac@senac.local"
metabase_admin_senha: "senac"
metabase_admin_nome: "Aluno"
metabase_admin_sobrenome: "Senac"
metabase_site_nome: "VM de aula"

# Como o Postgres local aparece na lista de bancos do Metabase.
metabase_banco_nome: "Postgres da aula"
metabase_banco_dbname: "postgres"

# --- DBeaver --------------------------------------------------------
# Workspace padrão do DBeaver 21+ (o "workspace6").
dbeaver_workspace: "{{ aluno_home }}/.local/share/DBeaverData/workspace6"

# --- Airflow ------------------------------------------------------
# Airflow 3.2.0+ é o primeiro a suportar Python 3.14 (o do Ubuntu 26.04).
# O Airflow 2.x não roda no 3.14 — não existe constraints-3.14.txt para ele.
airflow_versao: "3.3.0"
airflow_home: "/opt/airflow"
# Porta do api-server (o "webserver" do Airflow 2 virou api-server no 3).
airflow_porta: 9876
# Login do aluno na interface web. O papel "admin" é um dos quatro do simple
# auth manager: viewer, user, op, admin.
airflow_usuario: "senac"
airflow_senha: "senac"
# Arquivo de senhas do simple auth manager. Apontamos para um caminho nosso
# em vez do "...json.generated" padrão, deixando claro que quem manda aqui é
# o repositório, e não a senha sorteada na primeira execução.
airflow_senhas_arquivo: "{{ airflow_home }}/simple_auth_manager_passwords.json"
# Conexão única que aparece na tela de Connections, apontando para o Postgres
# local com o usuário do aluno.
airflow_conexao_postgres: "postgres_aula"
# Marcador de que o banco de metadados já foi limpo dos DAGs de exemplo.
# Aumente o número se algum dia precisar forçar uma nova limpeza.
airflow_marcador_limpeza: "{{ airflow_home }}/.limpeza-exemplos-1"
# A versão do Python precisa bater com a do sistema, senão o "python3.X -m
# venv" não existe e o constraints file do Airflow não é encontrado. Em vez de
# cravar o número (3.14 no Ubuntu 26.04, 3.13 no Debian 13, 3.12 no 24.04),
# derivamos do interpretador que o próprio Ansible está usando — que é o
# python3 do sistema, exatamente o que vai receber o venv.
airflow_python: "{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}"

# --- Clojure ------------------------------------------------------
clojure_versao: "1.12.0.1495"
