---
# Neo4j Community — banco de dados de grafos, instalado pelo repositório apt
# oficial da Neo4j.
#
# Diferente de todos os outros repositórios usados aqui, este NÃO é separado por
# distribuição: a suite é "stable" para todo mundo e o que muda é o componente
# (3.4 ... 4.4, 5, latest). Por isso não há nada vindo dos fatos na linha do
# apt — o mesmo repositório serve Ubuntu e Debian, e os pacotes são
# "Architecture: all" (é Java), o que cobre amd64 e arm64 de uma vez.

- name: Garantir o diretório de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar a chave de assinatura da Neo4j
  ansible.builtin.get_url:
    url: https://debian.neo4j.com/neotechnology.gpg.key
    dest: /etc/apt/keyrings/neo4j.asc
    mode: "0644"

- name: Adicionar o repositório da Neo4j
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/neo4j.asc]
      https://debian.neo4j.com stable {{ neo4j_componente }}
    filename: neo4j
    state: present

# A mesma JRE que a role metabase usa. Não é coincidência: é o motivo de a role
# instalar o Neo4j da série 2026 e não o 5.26 LTS — o 5.26 aceita só Java 17 ou
# 21, o que exigiria uma segunda JDK na VM e ainda deixaria a armadilha de o
# "java" do PATH ser o 25, que ele recusa. O 2026 aceita Java 25.
- name: Instalar o Java 25 (JRE)
  ansible.builtin.apt:
    name: openjdk-25-jre-headless
    state: present
    update_cache: true

# O cypher-shell entra junto, como dependência do pacote neo4j.
- name: Instalar o Neo4j {{ neo4j_versao }}
  ansible.builtin.apt:
    name: "neo4j=1:{{ neo4j_versao }}"
    state: present
    update_cache: true

# --- Configuração ----------------------------------------------------
# O pacote traz o neo4j.conf com tudo comentado, ou seja, nos valores padrão —
# inclusive escutando só localhost. Em vez de versionar o arquivo inteiro (são
# centenas de linhas que mudam de versão para versão), acrescentamos um bloco
# marcado no fim dele. A chave abaixo não existe no arquivo do pacote, nem
# comentada, então não há risco de configuração duplicada.
#
# Dono e permissão ficam de fora de propósito: o postinst do pacote faz
# "chown -R neo4j:adm /etc/neo4j", e fixar aqui só criaria uma briga silenciosa
# a cada instalação. O neo4j.conf também é um conffile do dpkg, então numa troca
# de versão ele vai avisar que o arquivo foi modificado — o padrão do apt não
# interativo é manter a nossa versão, que é o que queremos.
- name: Ajustar o mínimo de caracteres da senha no neo4j.conf
  ansible.builtin.blockinfile:
    path: /etc/neo4j/neo4j.conf
    marker: "# {mark} GERENCIADO PELO ANSIBLE - VM de aula"
    block: |
      # O Neo4j exige 8 caracteres por padrão, e a senha da turma é menor.
      # O mínimo acompanha o tamanho de neo4j_senha, então trocá-la em
      # group_vars continua valendo.
      dbms.security.auth_minimum_password_length={{ neo4j_senha | length }}
  notify: reiniciar neo4j

# --- Senha inicial ---------------------------------------------------
# O set-initial-password só funciona ANTES da primeira subida do banco: depois
# que o usuário existe, ele recusa. Por isso a tarefa roda uma vez só, guardada
# por um marcador — o mesmo recurso que a role airflow usa para a limpeza dos
# exemplos. Sem isso, a segunda execução do playbook falharia.
#
# O acl é o que permite ao Ansible trocar de root para o usuário neo4j sem
# esbarrar em "Failed to set permissions on the temporary files" (a role
# postgresql instala pelo mesmo motivo). A role não depende dela estar ativa.
- name: Instalar o acl (para o Ansible virar o usuário neo4j)
  ansible.builtin.apt:
    name: acl
    state: present

- name: Verificar se a senha inicial já foi definida
  ansible.builtin.stat:
    path: "{{ neo4j_marcador_senha }}"
  register: neo4j_senha_definida

# A senha vai como argumento porque é o único jeito que o comando aceita. Em
# servidor de verdade isso deixaria a senha no histórico do shell; aqui é VM de
# aula, com a senha já em texto claro no group_vars.
- name: Definir a senha inicial do usuário neo4j
  ansible.builtin.command:
    argv:
      - /usr/bin/neo4j-admin
      - dbms
      - set-initial-password
      - "{{ neo4j_senha }}"
  become: true
  become_user: neo4j
  when: not neo4j_senha_definida.stat.exists
  notify: reiniciar neo4j

- name: Registrar que a senha inicial foi definida
  ansible.builtin.file:
    path: "{{ neo4j_marcador_senha }}"
    state: touch
    owner: neo4j
    group: neo4j
    mode: "0644"
  when: not neo4j_senha_definida.stat.exists

- name: Habilitar e iniciar o Neo4j
  ansible.builtin.service:
    name: neo4j
    state: started
    enabled: true
