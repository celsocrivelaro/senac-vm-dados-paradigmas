---
# Clojure roda sobre a JVM, então instalamos o JDK primeiro e depois
# a ferramenta de linha de comando oficial (Clojure CLI / "clj").

- name: Instalar o JDK e o rlwrap (necessário para o REPL do Clojure)
  ansible.builtin.apt:
    name:
      - default-jdk
      - rlwrap
    state: present
    update_cache: true

- name: Baixar o instalador oficial da Clojure CLI
  ansible.builtin.get_url:
    url: "https://github.com/clojure/brew-install/releases/download/{{ clojure_versao }}/linux-install.sh"
    dest: /tmp/clojure-install.sh
    mode: "0755"

- name: Instalar a Clojure CLI
  ansible.builtin.command: /tmp/clojure-install.sh
  args:
    creates: /usr/local/bin/clojure   # idempotência: só instala 1x
