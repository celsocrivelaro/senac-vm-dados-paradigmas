---
# Instala o PostgreSQL do repositório do Ubuntu e ajusta a config em /etc.

# Metapacotes "postgresql"/"postgresql-client" em vez de "postgresql-18": cada
# distro aponta para a versão que ela empacota (18 no Ubuntu 26.04, 17 no
# Debian 13), então o mesmo repositório serve as duas sem número cravado.
- name: Instalar PostgreSQL e a biblioteca Python (para os módulos community.postgresql)
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-client
      - python3-psycopg2
      # acl: necessário para o Ansible trocar de root para o usuário postgres
      # sem esbarrar em "Failed to set permissions on the temporary files".
      - acl
    state: present
    update_cache: true

# --- Descobrir a versão instalada ------------------------------------
# O pacote cria /etc/postgresql/<versao>/main. Ler o nome desse diretório é
# mais confiável que deduzir a versão da distro, e é o mesmo caminho que os
# templates abaixo precisam montar.

- name: Descobrir a versão do PostgreSQL instalada
  ansible.builtin.find:
    paths: /etc/postgresql
    file_type: directory
    depth: 1
  register: postgres_diretorios

- name: Falhar com mensagem clara se nenhum cluster foi encontrado
  ansible.builtin.fail:
    msg: >-
      Não encontrei nenhum diretório de versão em /etc/postgresql. O pacote
      "postgresql" instalou? Rode "apt policy postgresql" para conferir. Se
      precisar apontar a versão na mão, use "-e postgres_versao=17".
  when: postgres_diretorios.files | length == 0

# O max cobre a máquina com mais de um cluster instalado (ex.: depois de um
# upgrade em que a versão antiga ficou para trás).
- name: Guardar a versão encontrada
  ansible.builtin.set_fact:
    postgres_versao: "{{ postgres_diretorios.files | map(attribute='path') | map('basename') | map('int') | max }}"
  when: postgres_versao is not defined

- name: Garantir que o serviço está ativo e habilitado no boot
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# --- Configuração em /etc/postgresql/<versao>/main -------------------
# Os dois arquivos abaixo são gerados a partir de templates versionados
# no repositório. Quando você edita o template e o aluno roda
# "ansible-pull", só então o postgres é reiniciado (via handler).

- name: Configurar postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "/etc/postgresql/{{ postgres_versao }}/main/conf.d/aula.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: reiniciar postgres

- name: Configurar pg_hba.conf (regras de autenticação)
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_versao }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reiniciar postgres

# --- psycopg2 --------------------------------------------------------
# O driver já vem do apt (python3-psycopg2, instalado acima), que é a forma
# limpa no Ubuntu. Estas duas tarefas são uma rede de segurança: se por algum
# motivo o "import psycopg2" não funcionar, instala pelo pip.

- name: Verificar se o psycopg2 já está disponível no Python do sistema
  ansible.builtin.command: python3 -c "import psycopg2"
  register: psycopg2_disponivel
  changed_when: false
  failed_when: false

# --break-system-packages: desde o 24.04 (PEP 668) o Ubuntu bloqueia pip
# global para não quebrar pacotes do sistema. Aqui é intencional e só roda
# quando o apt não resolveu.
- name: Instalar o psycopg2 pelo pip (só se ainda não estiver disponível)
  ansible.builtin.pip:
    name: psycopg2
    extra_args: --break-system-packages
  when: psycopg2_disponivel.rc != 0

# --- Usuário do aluno ------------------------------------------------
# O DBeaver conecta por TCP (o driver JDBC não fala socket Unix), e em TCP o
# pg_hba exige senha. O "peer" do socket não vale aqui — por isso o aluno
# precisa de uma role própria no Postgres, com senha.

- name: Criar a role do aluno no PostgreSQL
  community.postgresql.postgresql_user:
    name: "{{ postgres_usuario_aluno }}"
    password: "{{ postgres_senha_aluno }}"
    role_attr_flags: LOGIN,CREATEDB
    state: present
  become: true
  become_user: postgres
