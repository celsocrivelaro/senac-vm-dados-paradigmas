---
# Rustup instala a toolchain no HOME do usuário, então estas tarefas
# rodam como o aluno (become_user), e NÃO como root.

- name: Baixar o instalador do rustup
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: "0755"

- name: Instalar o rustup (toolchain stable) para o aluno
  ansible.builtin.command: /tmp/rustup-init.sh -y --default-toolchain stable
  become: true
  become_user: "{{ aluno_usuario }}"
  args:
    creates: "{{ aluno_home }}/.rustup"   # idempotência: só roda 1x
