---
# Apache Airflow num virtualenv dedicado em /opt/airflow.
#
# O Airflow NÃO tem pacote apt e é sensível a versões de dependências,
# por isso a instalação usa o "constraints file" oficial do projeto
# (a forma recomendada pela documentação do Airflow).

# A role não depende da role "python" estar ativa: instala aqui o que precisa
# para criar o venv. Usamos python3-venv (e não python3.14-venv) porque é um
# metapacote que aponta para o Python padrão do Ubuntu — que é justamente o
# que airflow_python precisa ser.
- name: Instalar o suporte a venv do Python
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Criar o diretório do Airflow
  ansible.builtin.file:
    path: "{{ airflow_home }}"
    state: directory
    owner: "{{ aluno_usuario }}"
    group: "{{ aluno_usuario }}"
    mode: "0755"

- name: Criar o virtualenv e instalar o Airflow (com constraints)
  ansible.builtin.pip:
    name: "apache-airflow=={{ airflow_versao }}"
    virtualenv: "{{ airflow_home }}/venv"
    virtualenv_command: "python{{ airflow_python }} -m venv"
    extra_args: >-
      --constraint
      https://raw.githubusercontent.com/apache/airflow/constraints-{{ airflow_versao }}/constraints-{{ airflow_python }}.txt
  become: true
  become_user: "{{ aluno_usuario }}"
  environment:
    AIRFLOW_HOME: "{{ airflow_home }}"

- name: Inicializar/migrar o banco de metadados do Airflow
  ansible.builtin.command: "{{ airflow_home }}/venv/bin/airflow db migrate"
  become: true
  become_user: "{{ aluno_usuario }}"
  environment:
    AIRFLOW_HOME: "{{ airflow_home }}"
  args:
    creates: "{{ airflow_home }}/airflow.db"   # não roda de novo se já existe

# O simple auth manager lê este arquivo na subida. Sorteando a senha, cada VM
# ficaria com uma diferente — aqui ela é fixa e igual para a turma inteira.
- name: Definir o usuário e a senha da interface web
  ansible.builtin.template:
    src: simple_auth_manager_passwords.json.j2
    dest: "{{ airflow_senhas_arquivo }}"
    owner: "{{ aluno_usuario }}"
    group: "{{ aluno_usuario }}"
    mode: "0600"
  notify: reiniciar airflow

# A senha sorteada na primeira execução fica para trás neste arquivo; apagar
# evita que o aluno ache credencial velha e tente usá-la.
- name: Remover o arquivo de senha sorteada da primeira execução
  ansible.builtin.file:
    path: "{{ airflow_home }}/simple_auth_manager_passwords.json.generated"
    state: absent

- name: Instalar o serviço systemd do Airflow
  ansible.builtin.template:
    src: airflow.service.j2
    dest: /etc/systemd/system/airflow.service
    mode: "0644"
  notify:
    - recarregar systemd
    - reiniciar airflow

- name: Habilitar e iniciar o Airflow
  ansible.builtin.service:
    name: airflow
    state: started
    enabled: true
