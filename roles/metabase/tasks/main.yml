---
# Metabase — ferramenta de BI, roda como um JAR sobre a JVM.
#
# Não existe repositório apt oficial: a forma indicada pela própria Metabase é
# baixar o JAR e rodá-lo como serviço. O JAR é versionado no nome do arquivo,
# então trocar metabase_versao baixa o novo e o systemd reinicia sozinho.

# A doc pede o JRE 25 da Eclipse Temurin. Usamos o OpenJDK 25 do próprio
# Ubuntu, que roda o mesmo JAR e evita mais um repositório de terceiro na VM.
- name: Instalar o Java 25 (JRE)
  ansible.builtin.apt:
    name: openjdk-25-jre-headless
    state: present
    update_cache: true

- name: Criar o diretório do Metabase
  ansible.builtin.file:
    path: "{{ metabase_home }}"
    state: directory
    owner: "{{ aluno_usuario }}"
    group: "{{ aluno_usuario }}"
    mode: "0755"

# A versão vai no nome do arquivo de propósito: assim o get_url não rebaixa
# centenas de MB a cada execução, e uma troca de versão vira um download novo
# mais a mudança do ExecStart — que o handler transforma em restart.
- name: Baixar o JAR do Metabase
  ansible.builtin.get_url:
    url: "https://downloads.metabase.com/{{ metabase_versao }}/metabase.jar"
    dest: "{{ metabase_home }}/metabase-{{ metabase_versao }}.jar"
    owner: "{{ aluno_usuario }}"
    group: "{{ aluno_usuario }}"
    mode: "0644"

- name: Instalar o serviço systemd do Metabase
  ansible.builtin.template:
    src: metabase.service.j2
    dest: /etc/systemd/system/metabase.service
    mode: "0644"
  notify:
    - recarregar systemd
    - reiniciar metabase

# --- Escotilha de emergência -----------------------------------------
# Numa VM onde o assistente da tela já foi concluído à mão, o setup-token não
# existe mais e a conta da turma nunca foi criada — a role não tem como entrar.
# Este bloco resolve, mas leva junto dashboards, perguntas e usuários salvos.
# Por isso vem desligado e só roda quando você pede explicitamente:
#   sudo ansible-pull ... -e metabase_recriar_banco_interno=true
- name: Parar o Metabase para recriar o banco interno
  ansible.builtin.service:
    name: metabase
    state: stopped
  when: metabase_recriar_banco_interno | bool

- name: Apagar o banco interno do Metabase
  ansible.builtin.file:
    path: "{{ metabase_home }}/{{ item }}"
    state: absent
  loop:
    - metabase.mv.db
    - metabase.trace.db
  when: metabase_recriar_banco_interno | bool

- name: Habilitar e iniciar o Metabase
  ansible.builtin.service:
    name: metabase
    state: started
    enabled: true

# --- Configuração pela API -------------------------------------------
# O Metabase não lê configuração de arquivo na edição open source: conta de
# admin e bancos só entram pela API (é o que o assistente da tela faz por
# baixo). Daqui para baixo tudo é chamada HTTP em localhost.

# Os handlers só rodariam no fim do play. Se a unit mudou agora, a API abaixo
# falaria com o processo antigo — ou com nenhum, no primeiro boot.
- name: Aplicar as mudanças pendentes do serviço antes de falar com a API
  ansible.builtin.meta: flush_handlers

# O JAR sobe a JVM e migra o banco interno: numa VM de aula isso passa do
# minuto na primeira vez. Sem esta espera, o setup abaixo bate em porta fechada.
- name: Esperar o Metabase responder em {{ metabase_url }}
  ansible.builtin.uri:
    url: "{{ metabase_url }}/api/session/properties"
  register: metabase_propriedades
  until: metabase_propriedades.status == 200
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false

- name: Falhar com mensagem clara se o Metabase não subiu
  ansible.builtin.fail:
    msg: >-
      O Metabase não respondeu em {{ metabase_url }} depois de 5 minutos.
      Veja o que houve com "journalctl -u metabase -n 50". Causa comum: pouca
      memória na VM — o Metabase pede uns 2 GB livres para subir.
  when: metabase_propriedades.status != 200

# setup-token só vem preenchido enquanto o assistente não foi concluído: o
# próprio Metabase o apaga assim que o primeiro usuário é criado. Depois disso
# ele vem null e esta tarefa não roda mais.
#
# O "| length > 0" não é enfeite: desde o Ansible 2.19 o when: exige booleano,
# e o token null chegaria como NoneType (ou como string, quando existe) —
# os dois derrubam a tarefa. O default() sozinho não resolve, porque ele troca
# valor indefinido, não valor nulo; daí o segundo argumento.
- name: Criar a conta de administrador da turma (primeira execução)
  ansible.builtin.uri:
    url: "{{ metabase_url }}/api/setup"
    method: POST
    body_format: json
    body:
      token: "{{ metabase_propriedades.json['setup-token'] }}"
      user:
        first_name: "{{ metabase_admin_nome }}"
        last_name: "{{ metabase_admin_sobrenome }}"
        email: "{{ metabase_admin_email }}"
        password: "{{ metabase_admin_senha }}"
        site_name: "{{ metabase_site_nome }}"
      prefs:
        site_name: "{{ metabase_site_nome }}"
        allow_tracking: false
  when: metabase_propriedades.json['setup-token'] | default('', true) | length > 0

- name: Abrir uma sessão na API do Metabase
  ansible.builtin.uri:
    url: "{{ metabase_url }}/api/session"
    method: POST
    body_format: json
    body:
      username: "{{ metabase_admin_email }}"
      password: "{{ metabase_admin_senha }}"
  register: metabase_sessao
  changed_when: false
  failed_when: false

- name: Falhar com mensagem clara se o login de admin não bate
  ansible.builtin.fail:
    msg: >-
      O Metabase recusou o login {{ metabase_admin_email }} (HTTP
      {{ metabase_sessao.status }}). Isso acontece quando o assistente da tela
      já foi concluído à mão com outra conta: o setup-token é consumido na
      criação do primeiro usuário e não volta. Saídas: apontar
      metabase_admin_email e metabase_admin_senha (group_vars/all.yml) para a
      conta que já existe, ou recomeçar do zero repetindo o comando com
      "-e metabase_recriar_banco_interno=true" — que apaga o banco interno,
      dashboards e perguntas salvas junto.
  when: metabase_sessao.status != 200

# O POST abaixo não é idempotente: repetido, cadastra o mesmo Postgres várias
# vezes. Por isso conferimos a lista antes. Versões recentes devolvem os bancos
# dentro de "data"; o default cobre as antigas, que devolviam a lista crua.
- name: Listar os bancos já cadastrados no Metabase
  ansible.builtin.uri:
    url: "{{ metabase_url }}/api/database"
    headers:
      X-Metabase-Session: "{{ metabase_sessao.json.id }}"
  register: metabase_bancos
  changed_when: false

- name: Cadastrar o Postgres local no Metabase
  ansible.builtin.uri:
    url: "{{ metabase_url }}/api/database"
    method: POST
    headers:
      X-Metabase-Session: "{{ metabase_sessao.json.id }}"
    body_format: json
    body:
      engine: postgres
      name: "{{ metabase_banco_nome }}"
      details:
        host: localhost
        port: "{{ postgres_porta }}"
        dbname: "{{ metabase_banco_dbname }}"
        user: "{{ postgres_usuario_aluno }}"
        password: "{{ postgres_senha_aluno }}"
        # A conexão é por TCP em localhost, onde o pg_hba pede senha — o mesmo
        # caminho que o DBeaver usa. Sem SSL: não sai da máquina.
        ssl: false
        tunnel-enabled: false
    status_code: [200, 201]
  when: metabase_banco_nome not in (metabase_bancos.json.data | default(metabase_bancos.json) | map(attribute='name') | list)
