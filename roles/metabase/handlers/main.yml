---
# Mesma ordem da role do airflow: o daemon_reload precisa vir antes do
# restart, senão o systemd reinicia o serviço com a unit antiga.
- name: recarregar systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: reiniciar metabase
  ansible.builtin.systemd_service:
    name: metabase
    state: restarted
