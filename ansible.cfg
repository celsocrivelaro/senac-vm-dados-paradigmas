[defaults]
# Silencia o aviso de "no inventory" — aqui só existe o localhost.
inventory = inventory
# Deixa a saída mais legível durante as aulas.
stdout_callback = yaml
# Onde o ansible-pull guarda o clone do repositório em cada máquina.
# (valor padrão, deixado explícito para referência)
retry_files_enabled = false

[privilege_escalation]
become = true
become_method = sudo
