[defaults]
# Silencia o aviso de "no inventory" — aqui só existe o localhost.
inventory = inventory
# Deixa a saída mais legível durante as aulas.
# O antigo callback "yaml" (community.general.yaml) foi removido; hoje o
# jeito correto é o callback padrão com result_format=yaml.
stdout_callback = default
result_format = yaml
# Silencia o aviso de "discovered Python interpreter" — aqui o python3 do
# sistema é sempre o certo.
interpreter_python = auto_silent
# Onde o ansible-pull guarda o clone do repositório em cada máquina.
# (valor padrão, deixado explícito para referência)
retry_files_enabled = false

[privilege_escalation]
become = true
become_method = sudo
