---
# Playbook principal.
# O ansible-pull procura por "local.yml" por padrão, então este é o
# ponto de entrada quando o aluno roda:
#   ansible-pull -U https://github.com/celsocrivelaro/senac-vm.git
#
# Cada "role" abaixo é um módulo independente. Comente uma linha para
# desativar um componente numa turma específica.

- name: Configurar VM de aula
  hosts: local
  connection: local
  become: true          # roda as tarefas com sudo por padrão

  # VM que ficou suspensa ou voltou de snapshot acorda com o relógio atrasado.
  # Aí o apt recusa os índices do Ubuntu com "Release file is not valid yet"
  # e nada se instala. Então acerta a hora antes de qualquer coisa.
  pre_tasks:
    - name: Ativar a sincronização de hora por NTP
      ansible.builtin.command: timedatectl set-ntp true
      changed_when: false

    - name: Esperar o relógio sincronizar
      ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
      register: relogio
      until: relogio.stdout == "yes"
      retries: 12
      delay: 5
      changed_when: false
      failed_when: false

    - name: Avisar se o relógio não sincronizou
      ansible.builtin.fail:
        msg: >-
          O relógio da VM não sincronizou (hora atual: {{ ansible_date_time.iso8601 }}).
          O apt vai recusar os índices do Ubuntu. Acerte a hora manualmente com
          "sudo timedatectl set-time 'AAAA-MM-DD HH:MM:SS'" e rode de novo.
      when: relogio.stdout != "yes"

  roles:
    - postgresql   # PostgreSQL + configuração em /etc/postgresql
    - dbeaver      # DBeaver Community + conexão pronta com o Postgres local
    - vscode       # VS Code + extensões de Python e SQL
    - chrome       # Google Chrome
    - airflow      # Apache Airflow 3 (venv dedicado em /opt/airflow)
    - metabase     # Metabase (JAR + systemd, banco interno em H2)

    # --- Desativadas por enquanto ------------------------------------
    # As roles continuam no repositório (roles/), prontas para uso.
    # Para ativar um componente, basta descomentar a linha.
    # - common     # pacotes base, utilitários, Lua 5.4
    # - python     # Python 3, pip, venv, pipx, Scrapy
    # - rust       # Rustup (instalado no home do aluno)
    # - prolog     # SWI-Prolog
    # - clojure    # Clojure CLI (+ JDK)
